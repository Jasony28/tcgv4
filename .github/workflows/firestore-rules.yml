# Règles de sécurité Firestore (anti-triche) : testées à chaque modification, puis mises en ligne.
#
#  - À chaque push ou pull request qui touche les règles, l'économie ou les cartes : les tests tournent
#    dans l'émulateur Firebase (le vrai code du jeu + des tentatives de triche).
#  - Sur main (ou avec le bouton « Run workflow ») : si les tests passent, firestore.rules est déployé
#    sur le projet Firebase, avec le même secret FIREBASE_SERVICE_ACCOUNT que la clôture des enchères.
#    Si le déploiement est refusé (droits du compte de service), copier firestore.rules dans
#    la console Firebase → Firestore → Règles → Publier.
name: Règles Firestore

on:
  push:
    paths:
      - 'firestore.rules'
      - 'econ-config.js'
      - 'econ-service.js'
      - 'cards*.js'
      - 'achievements-config.js'
      - 'booster-draws.js'
      - '*-service.js'
      - 'quest-manager.js'
      - 'achievements.js'
      - 'scripts/gen-rules-data.mjs'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Les chiffres et cartes recopiés dans firestore.rules sont à jour
        run: |
          node scripts/gen-rules-data.mjs
          git diff --exit-code firestore.rules || { echo "::error::Lance « node scripts/gen-rules-data.mjs » et commite firestore.rules"; exit 1; }
      - name: Installer les outils de test
        run: npm ci
        working-directory: tests
      - name: Tests dans l'émulateur Firebase
        run: npm test
        working-directory: tests

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installer firebase-tools
        run: npm ci
        working-directory: tests
      - name: Déployer firestore.rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant"; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          tests/node_modules/.bin/firebase deploy --only firestore:rules --project tcgjwbndr --non-interactive
