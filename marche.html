<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hôtel des Ventes - JWBnDr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="main.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1224">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JWBnDr">
    <link rel="apple-touch-icon" href="assets/logo/logo-192.png">
    <link rel="icon" href="assets/logo/logo-192.png">
</head>
<body>
    <script src="splash.js"></script>
    <header class="main-header"></header>
    <main class="market-page">
        <h2 class="page-title">Hôtel des Ventes</h2>
        <p class="page-subtitle">Enchères en pièces ou échanges contre des cartes</p>

        <nav class="booster-tabs market-views" id="market-tabs" aria-label="Hôtel des Ventes">
            <button class="booster-tab active" data-tab="all">🛒 Acheter</button>
            <button class="booster-tab" data-tab="mine">📦 Mes ventes <span id="mine-count" class="count-pill" hidden></span></button>
            <button class="booster-tab" data-tab="history">📜 Historique <span id="history-dot" class="history-dot" hidden></span></button>
        </nav>
        <div class="filter-chips" id="market-filters">
            <button class="chip active" data-filter="all">Tout</button>
            <button class="chip" data-filter="auction">💰 Enchères</button>
            <button class="chip" data-filter="trade">🔄 Échanges</button>
            <button class="chip" data-filter="fulfil">✓ Je peux échanger <span id="fulfil-count" class="count-pill" hidden></span></button>
        </div>
        <div class="market-toolbar" id="market-toolbar">
            <button id="create-listing-button" class="create-listing-button compact">+ Vendre</button>
            <input type="search" id="market-search" placeholder="Rechercher une carte, un booster…">
            <select id="market-sort" aria-label="Trier">
                <option value="ending">Fin proche</option>
                <option value="recent">Plus récentes</option>
                <option value="price-asc">Prix croissant</option>
                <option value="price-desc">Prix décroissant</option>
            </select>
        </div>

        <p id="market-empty" class="market-empty" hidden></p>
        <div id="market-grid" class="market-grid"></div>

        <!-- Historique : ventes, achats, échanges et cartes obtenues -->
        <section id="history-view" class="history-view" hidden></section>
    </main>

    <!-- Détail d'une annonce -->
    <div id="listing-modal" class="overlay" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" id="listing-modal-close">&times;</span>
            <div id="listing-modal-body"></div>
        </div>
    </div>

    <!-- Création d'une annonce -->
    <div id="create-modal" class="overlay" style="display:none;">
        <div class="modal-content create-modal-content">
            <span class="close-btn" id="create-modal-close">&times;</span>
            <h3>Nouvelle annonce</h3>
            <div id="create-body"></div>
        </div>
    </div>

    <div id="toast-container"></div>
    <!-- Modale de confirmation universelle pour showConfirmDialog -->
    <div id="custom-modal" style="display:none;">
      <div class="modal-content">
        <span class="close-btn" id="custom-modal-close">&times;</span>
        <div id="custom-modal-title"></div>
        <div id="custom-modal-message"></div>
        <div id="custom-modal-actions"></div>
      </div>
    </div>

    <script type="module" src="header.js"></script>
    <script type="module" src="marche.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
</html>
