<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JWBnDr - Connexion</title>
    <link rel="stylesheet" href="main.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1224">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JWBnDr">
    <link rel="apple-touch-icon" href="assets/logo/logo.png">
    <link rel="icon" href="assets/logo/logo.png">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <img class="auth-logo" src="assets/logo/logo.png" alt="Logo JWBnDr">
            <h1 class="game-title">JWBnDr</h1>
            <p class="auth-tagline">Ouvre des boosters, complète ta collection, échange avec tes potes.</p>
            <div class="card-fan" aria-hidden="true"><span></span><span></span><span></span></div>
            <h2>Connexion / Inscription</h2>
            <button id="google-login-button" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt=""/>
                Se connecter avec Google
            </button>
            <p id="error-message" class="error"></p>
        </div>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
</html>
