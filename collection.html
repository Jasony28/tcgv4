<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mon Album - JWBnDr</title>
    <link rel="stylesheet" href="main.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1224">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JWBnDr">
    <link rel="apple-touch-icon" href="assets/logo/logo.png">
    <link rel="icon" href="assets/logo/logo.png">
    
</head>
<body>
    <script src="splash.js"></script>
    <header class="main-header"></header>
    <main class="collection-container">
        <h2>Ma Collection</h2>
        <div id="v3-banner" class="v3-banner" hidden>
            <strong>✨ Collection V3 — bientôt disponible</strong>
            <span>50 nouvelles cartes dont 6 légendaires arrivent très vite. Prépare tes pièces !</span>
        </div>
        <div class="collection-progress">
            <div class="progress-head">
                <span><strong id="collection-count">0 / 0</strong> cartes</span>
                <span id="collection-pct">0%</span>
            </div>
            <div class="xp-bar"><div class="xp-bar-fill" id="collection-fill"></div></div>
        </div>
        <a href="profil.html#succes" class="album-achievements" id="album-achievements" title="Voir les succès"></a>
        <div class="filter-chips" id="collection-filters">
            <button class="chip active" data-filter="all">Toutes</button>
            <button class="chip" data-filter="owned">Possédées</button>
            <button class="chip" data-filter="missing">Manquantes</button>
            <button class="chip" data-filter="Commune">Communes</button>
            <button class="chip" data-filter="Rare">Rares</button>
            <button class="chip" data-filter="epique">Épiques</button>
            <button class="chip" data-filter="Légendaire">Légendaires</button>
        </div>
        <div id="collection-grid" class="card-grid"></div>
    </main>
    <div id="card-overlay" class="overlay" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="view-mode">
                <img id="overlay-image" src="" alt="Carte en grand">
                <div id="overlay-actions">
                    <p id="overlay-card-name"></p>
                    <p>Quantité possédée : <strong id="overlay-card-quantity"></strong></p>
                    <button id="auction-button" style="display: none;">Vendre ou échanger</button>
                    <button id="console-sell-button" class="button-secondary" style="display: none;">Vendre à la console</button>
                </div>
            </div>
            <div id="sell-mode" style="display: none;">
                <h3>Mettre en Vente : <span id="sell-card-name"></span></h3>
                <div id="sell-card-preview" class="card"></div>
                <div class="sell-form">
                    <label for="sell-quantity-input">Quantité à vendre (max: <span id="sell-max-quantity"></span>) :</label>
                    <input type="number" id="sell-quantity-input" min="1">
                    <div id="sell-price-container"> <label for="sell-price-input">Prix de départ (min: <span id="sell-min-price"></span> pièces) :</label>
    <input type="number" id="sell-price-input">
</div>
                    <button id="confirm-sell-button">Confirmer la mise en vente</button>
                </div>
            </div>
            <p id="modal-error-message" class="error"></p>
        </div>
    </div>
     <div id="toast-container"></div>
    <div id="custom-modal" style="display:none;">
      <div class="modal-content">
        <span class="close-btn" id="custom-modal-close">&times;</span>
        <div id="custom-modal-title" style="font-weight:bold;font-size:1.15em;margin-bottom:12px;"></div>
        <div id="custom-modal-message" style="margin-bottom:20px;"></div>
        <div id="custom-modal-actions" style="display:flex;gap:12px;justify-content:center;"></div>
      </div>
    </div>

    <!-- Scripts APRES le HTML -->
    <script type="module" src="header.js"></script>
    <script type="module" src="collection.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
</html>
